name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fzf
      - if: runner.os == 'macOS'
        run: brew install fzf
      - run: zsh -f tests.zsh
      - name: plugin loads
        run: zsh -f -c 'source ./command-finder.plugin.zsh && whence -w command_finder cf::group'
